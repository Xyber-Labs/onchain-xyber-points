[toolchain]
package_manager = "yarn"
channel = "nightly"

[features]
resolution = true
skip-lint = false

[programs.localnet]
onchain_xyber_points = "DYNpaq7XujscK29FYuQD5h8rGtxPAwNPYiB8vbuQe4R7"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "sleep 3 && anchor idl init --provider.cluster localnet --filepath target/idl/onchain_xyber_points.json DYNpaq7XujscK29FYuQD5h8rGtxPAwNPYiB8vbuQe4R7 && yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/onchain-xyber-points.ts"
litesvm = "anchor build -- --features localnet && yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/litesvm.test.ts"
